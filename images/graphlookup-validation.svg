<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>validate_chain catches a skipped step before execution</title>
<desc>The agent tries to skip from query analysis directly to test writing. validate_chain catches the type mismatch: query_patterns cannot feed test_writer, which expects application_code.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .fill-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .fill-coral { fill: #FAECE7; stroke: #993C1D; }
  .fill-gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .fill-red { fill: #FCEBEB; stroke: #A32D2D; }
  .th-teal { fill: #085041; } .ts-teal { fill: #0F6E56; }
  .th-coral { fill: #712B13; } .ts-coral { fill: #993C1D; }
  .th-gray { fill: #444441; } .ts-gray { fill: #5F5E5A; }
  .th-red { fill: #791F1F; } .ts-red { fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="40" y="30">Valid chain (types match at every edge)</text>

<rect class="fill-teal" x="40" y="46" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th th-teal" x="105" y="64" text-anchor="middle" dominant-baseline="central">Query analysis</text>
<text class="ts ts-teal" x="105" y="82" text-anchor="middle" dominant-baseline="central">→ query_patterns</text>

<line x1="170" y1="71" x2="200" y2="71" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="fill-teal" x="204" y="46" width="140" height="50" rx="8" stroke-width="0.5"/>
<text class="th th-teal" x="274" y="64" text-anchor="middle" dominant-baseline="central">Schema review</text>
<text class="ts ts-teal" x="274" y="82" text-anchor="middle" dominant-baseline="central">→ schema_rec</text>

<line x1="344" y1="71" x2="374" y2="71" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="fill-teal" x="378" y="46" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th th-teal" x="443" y="64" text-anchor="middle" dominant-baseline="central">Code gen</text>
<text class="ts ts-teal" x="443" y="82" text-anchor="middle" dominant-baseline="central">→ application_code</text>

<line x1="508" y1="71" x2="538" y2="71" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="fill-teal" x="542" y="46" width="110" height="50" rx="8" stroke-width="0.5"/>
<text class="th th-teal" x="597" y="64" text-anchor="middle" dominant-baseline="central">Test writer</text>
<text class="ts ts-teal" x="597" y="82" text-anchor="middle" dominant-baseline="central">→ test_suite</text>

<text class="ts" x="186" y="116">query_patterns</text>
<text class="ts" x="356" y="116">schema_rec</text>
<text class="ts" x="516" y="116">application_code</text>

<line x1="40" y1="148" x2="640" y2="148" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>

<text class="th" x="40" y="178">Agent tries to skip straight to testing</text>

<g opacity="0.6">
<rect class="fill-coral" x="40" y="198" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th th-coral" x="105" y="216" text-anchor="middle" dominant-baseline="central">Query analysis</text>
<text class="ts ts-coral" x="105" y="234" text-anchor="middle" dominant-baseline="central">→ query_patterns</text>
</g>

<rect x="204" y="198" width="140" height="50" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>
<text class="ts" x="274" y="226" text-anchor="middle" opacity="0.3">skipped</text>

<rect x="378" y="198" width="130" height="50" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>
<text class="ts" x="443" y="226" text-anchor="middle" opacity="0.3">skipped</text>

<line x1="170" y1="223" x2="530" y2="223" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 4"/>

<circle cx="540" cy="223" r="12" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
<line x1="534" y1="217" x2="546" y2="229" stroke="#A32D2D" stroke-width="1.5"/>
<line x1="546" y1="217" x2="534" y2="229" stroke="#A32D2D" stroke-width="1.5"/>

<g opacity="0.6">
<rect class="fill-gray" x="560" y="198" width="90" height="50" rx="8" stroke-width="0.5"/>
<text class="th th-gray" x="605" y="216" text-anchor="middle" dominant-baseline="central">Test writer</text>
<text class="ts ts-gray" x="605" y="234" text-anchor="middle" dominant-baseline="central">expects:</text>
</g>

<rect class="fill-red" x="40" y="276" width="370" height="36" rx="6" stroke-width="0.5"/>
<text class="th th-red" x="225" y="298" text-anchor="middle" dominant-baseline="central">query_patterns ≠ application_code</text>

<text class="ts" x="424" y="298">Can't test what hasn't been built yet</text>

<rect x="40" y="336" width="600" height="40" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" opacity="0.3"/>
<text class="ts" x="340" y="360" text-anchor="middle">validate_chain catches this before a single step executes</text>

</svg>